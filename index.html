<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>loopfield</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>loopfield <span>pattern loops for electronic music</span></h1>
    <div class="transport">
      <button id="play" class="play" title="Space">▶ Play</button>
      <label>BPM <input id="bpm" type="number" min="60" max="200" /></label>
      <label>Swing <input id="swing" type="range" min="0" max="0.45" step="0.01" /></label>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Drums</h2>
      <div id="drums" class="grid"></div>
    </section>

    <section class="panel mix">
      <h2>Master</h2>
      <label>Filter <input id="cutoff" type="range" min="0" max="1" step="0.001" /></label>
      <label>Volume <input id="master" type="range" min="0" max="1" step="0.01" /></label>
    </section>
  </main>

  <footer>Space: play/stop · Drag to paint steps · Shift-click a drum step for an accent</footer>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
